<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KENZO x RYUGA - Nuke Bot Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Monospace', monospace; background: #050508; color: #fff; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #1a1a2e; margin-bottom: 20px; }
    .logo { font-size: 28px; font-weight: 800; color: #00ff88; letter-spacing: 2px; }
    .subtitle { color: #888; margin-top: 4px; font-size: 12px; }
    
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .card { background: #0d0d14; border: 1px solid #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card-title { color: #00ff88; font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 16px; text-transform: uppercase; }
    
    .input-group { margin-bottom: 12px; }
    .input-label { display: block; font-size: 9px; font-weight: 600; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input { width: 100%; background: #050508; border: 1px solid #1a1a2e; border-radius: 8px; padding: 12px; font-size: 13px; color: #fff; font-family: monospace; }
    .input:focus { outline: none; border-color: #00ff88; }
    
    .btn { padding: 12px 24px; border-radius: 8px; font-size: 12px; font-weight: 700; font-family: monospace; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-primary { background: #00ff88; color: #000; }
    .btn-primary:hover { background: #00e67a; }
    .btn-danger { background: #ff3333; color: #fff; }
    .btn-danger:hover { background: #ff1a1a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .cmd-btn { padding: 12px; border-radius: 8px; background: #0a0a0f; border: 1px solid #1a1a2e; text-align: center; cursor: pointer; transition: all 0.2s; }
    .cmd-btn:hover { border-color: #00ff88; background: #101018; }
    .cmd-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cmd-icon { font-size: 18px; margin-bottom: 3px; display: block; }
    .cmd-name { font-size: 10px; font-weight: 700; color: #fff; font-family: monospace; margin-bottom: 2px; }
    .cmd-desc { font-size: 8px; color: #888; font-family: monospace; }
    
    .status-bar { display: flex; align-items: center; gap: 10px; padding: 12px; background: #0d0d14; border-radius: 8px; border: 1px solid #1a1a2e; margin-bottom: 16px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #666; }
    .status-dot.online { background: #00ff88; animation: pulse 1.5s infinite; }
    .status-dot.connecting { background: #ffaa00; animation: spin 1s linear infinite; }
    .status-dot.error { background: #ff3333; }
    @keyframes pulse { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .status-text { font-family: monospace; font-weight: 600; font-size: 11px; }
    
    .log-container { background: #0a0a0f; border: 1px solid #1a1a2e; border-radius: 8px; height: 250px; overflow-y: auto; padding: 12px; font-family: monospace; font-size: 11px; line-height: 1.5; }
    .log-line { color: #ccc; margin-bottom: 2px; }
    .log-line.success { color: #00ff88; }
    .log-line.error { color: #ff3333; }
    .log-line.warning { color: #ffaa00; }
    .log-line.info { color: #00ff88; }
    
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tab { padding: 10px 20px; background: #0d0d14; border: 1px solid #1a1a2e; border-radius: 6px; color: #888; cursor: pointer; font-family: monospace; font-weight: 600; font-size: 11px; transition: all 0.2s; }
    .tab.active { background: #00ff88; color: #000; border-color: #00ff88; }
    .tab:hover:not(.active) { border-color: #00ff88; color: #00ff88; }
    
    .hidden { display: none !important; }
    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }
    
    .section { margin-bottom: 20px; }
    .section-title { color: #00ff88; font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; }
    
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 12px; font-weight: 700; font-family: monospace; cursor: pointer; transition: all 0.2s; border: none; }
    .btn-primary { background: #00ff88; color: #000; }
    .btn-primary:hover { background: #00e67a; }
    .btn-danger { background: #ff3333; color: #fff; }
    .btn-danger:hover { background: #ff1a1a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .cmd-btn { padding: 12px; border-radius: 8px; background: #0a0a0f; border: 1px solid #1a1a2e; text-align: center; cursor: pointer; transition: all 0.2s; }
    .cmd-btn:hover { border-color: #00ff88; background: #101018; }
    .cmd-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cmd-icon { font-size: 18px; margin-bottom: 3px; display: block; }
    .cmd-name { font-size: 10px; font-weight: 700; color: #fff; font-family: monospace; margin-bottom: 2px; }
    .cmd-desc { font-size: 8px; color: #888; font-family: monospace; }
    
    .cmd-btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    
    @keyframes pulse { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    @media (max-width: 768px) {
      .container { padding: 12px; }
      .row { flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">KENZO x RYUGA</div>
      <div class="subtitle">Nuke Bot Control Panel</div>
    </div>

    <!-- MAIN TABS: APP BOT | SELFBOT -->
    <div class="tabs" style="margin-bottom: 20px;">
      <button class="tab active" id="tab-appbot">🤖 APP BOT (Direct)</button>
      <button class="tab" id="tab-selfbot">👤 SELFBOT (Direct)</button>

    <!-- ==================== APP BOT TAB (Direct WebSocket to Discord) ==================== -->
    <div class="page active" id="page-appbot">
      <div class="status-bar">
        <div class="status-dot" id="appbotStatusDot"></div>
        <div class="status-text" id="appbotStatusText">Disconnected</div>
        <span style="margin-left: auto; color: #666; font-size: 10px;">Direct to Discord</span>
      </div>

      <div class="card">
        <div class="section-title">App Bot Configuration</div>
        <div class="row">
          <div class="input-group">
            <label class="input-label">Bot Token</label>
            <input type="password" class="input" id="appbotToken" placeholder="MTxxxxxxxxxxxxxxxxxxxx.xxxx.xxxxxxxxxxxxxxxxxxxxxxxx">
          </div>
          <div class="input-group">
            <label class="input-label">Server ID</label>
            <input type="text" class="input" id="appbotServerId" placeholder="123456789012345678" inputmode="numeric">
          </div>
        </div>
        <div class="input-group">
          <label class="input-label">Custom Name</label>
          <input type="text" class="input" id="appbotCustomName" placeholder="KENZO x RYUGA" value="KENZO x RYUGA">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button class="btn btn-primary" id="btnAppBotConnect" style="flex: 1;">▶ CONNECT</button>
          <button class="btn btn-danger" id="btnAppBotDisconnect" disabled style="flex: 1;">■ DISCONNECT</button>
        </div>
      </div>

      <div class="card" id="appbotCommands" style="opacity: 0.5; pointer-events: none;">
        <div class="section-title">Commands (Requires Connection)</div>
        <div class="cmd-btn-grid" id="appbotCommandsGrid">
          <button class="cmd-btn" data-cmd="BAN_ALL">
            <span class="cmd-icon">🔨</span>
            <span class="cmd-name">BAN ALL</span>
            <span class="cmd-desc">Ban every member</span>
          </button>
          <button class="cmd-btn" data-cmd="KICK_ALL">
            <span class="cmd-icon">👢</span>
            <span class="cmd-name">KICK ALL</span>
            <span class="cmd-desc">Kick every member</span>
          </button>
          <button class="cmd-btn" data-cmd="SPAM_ALL">
            <span class="cmd-icon">💬</span>
            <span class="cmd-name">SPAM ALL</span>
            <span class="cmd-desc">Flood all channels</span>
          </button>
          <button class="cmd-btn" data-cmd="DELETE_ALL">
            <span class="cmd-icon">🗑</span>
            <span class="cmd-name">DELETE CHANNELS</span>
            <span class="cmd-desc">Remove all channels</span>
          </button>
          <button class="cmd-btn" data-cmd="CREATE_CHANNELS">
            <span class="cmd-icon">➕</span>
            <span class="cmd-name">CREATE CHANNELS</span>
            <span class="cmd-desc">Mass create channels</span>
          </button>
          <button class="cmd-btn" data-cmd="CLAIM_ROLES">
            <span class="cmd-icon">⭐</span>
            <span class="cmd-name">CLAIM ROLES</span>
            <span class="cmd-desc">Grab all roles</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ==================== SELFBOT TAB (Direct WebSocket) ==================== -->
    <div class="page" id="page-selfbot">
      <div class="status-bar">
        <div class="status-dot" id="selfbotStatusDot"></div>
        <div class="status-text" id="selfbotStatusText">Disconnected</div>
        <span style="margin-left: auto; color: #666; font-size: 10px;">Direct WebSocket</span>
      </div>

      <div class="card">
        <div class="section-title">Selfbot Configuration</div>
        <div class="input-group">
          <label class="input-label">User Token</label>
          <input type="password" class="input" id="selfbotToken" placeholder="MTxxxxxxxxxxxxxxxxxxxx.xxxx.xxxxxxxxxxxxxxxxxxxxxxxx">
        </div>
        <div class="input-group">
          <label class="input-label">Server ID</label>
          <input type="text" class="input" id="selfbotServerId" placeholder="123456789012345678" inputmode="numeric">
        </div>
        <div class="input-group">
          <label class="input-label">Custom Name</label>
          <input type="text" class="input" id="selfbotCustomName" placeholder="KENZO x RYUGA" value="KENZO x RYUGA">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button class="btn btn-primary" id="btnSelfbotConnect" style="flex: 1;">▶ CONNECT</button>
          <button class="btn btn-danger" id="btnSelfbotDisconnect" disabled style="flex: 1;">■ DISCONNECT</button>
        </div>
      </div>

      <div class="card" id="selfbotCommands" style="opacity: 0.5; pointer-events: none;">
        <div class="section-title">Commands (Requires Connection)</div>
        <div class="cmd-btn-grid" id="selfbotCommandsGrid">
          <button class="cmd-btn" data-cmd="BAN_ALL">
            <span class="cmd-icon">🔨</span>
            <span class="cmd-name">BAN ALL</span>
            <span class="cmd-desc">Ban every member</span>
          </button>
          <button class="cmd-btn" data-cmd="KICK_ALL">
            <span class="cmd-icon">👢</span>
            <span class="cmd-name">KICK ALL</span>
            <span class="cmd-desc">Kick every member</span>
          </button>
          <button class="cmd-btn" data-cmd="SPAM_ALL">
            <span class="cmd-icon">💬</span>
            <span class="cmd-name">SPAM ALL</span>
            <span class="cmd-desc">Flood all channels</span>
          </button>
          <button class="cmd-btn" data-cmd="DELETE_ALL">
            <span class="cmd-icon">🗑</span>
            <span class="cmd-name">DELETE CHANNELS</span>
            <span class="cmd-desc">Remove all channels</span>
          </button>
          <button class="cmd-btn" data-cmd="CREATE_CHANNELS">
            <span class="cmd-icon">➕</span>
            <span class="cmd-name">CREATE CHANNELS</span>
            <span class="cmd-desc">Mass create channels</span>
          </button>
          <button class="cmd-btn" data-cmd="CLAIM_ROLES">
            <span class="cmd-icon">⭐</span>
            <span class="cmd-name">CLAIM ROLES</span>
            <span class="cmd-desc">Grab all roles</span>
          </button>
        </div>
      </div>
    </div>

    <!-- SHARED LOG CONTAINER -->
    <div class="card">
      <div class="section-title">Activity Log</div>
      <div class="log-container" id="logContainer"></div>
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button class="btn" id="btnClearLog" style="flex: 1;">🗑 CLEAR LOG</button>
        <button class="btn btn-primary" id="btnSaveLog" style="flex: 1;">💾 SAVE LOG</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== STATE ====================
    let appBotWs = null;
    let selfBotWs = null;
    let appBotConnected = false;
    let selfBotConnected = false;
    let selfBotResolved = false;
    let selfBotHeartbeat = null;
    let selfBotTimeout = null;
    
    // ==================== DOM ELEMENTS ====================
    const $ = (id) => document.getElementById(id);
    
    // ==================== UTILITIES ====================
    function log(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const line = document.createElement('div');
      line.className = 'log-line ' + type;
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
      const container = $('logContainer');
      if (container) {
        container.appendChild(line);
        container.scrollTop = container.scrollHeight;
      }
      console.log('[' + type.toUpperCase() + ']', message);
    }
    
    function setAppBotStatus(status) {
      const dot = $('appbotStatusDot');
      const text = $('appbotStatusText');
      const btn = $('btnAppBotDisconnect');
      const cmds = $('appbotCommandsGrid');
      
      if (!dot || !text || !btn || !cmds) return;
      
      if (status === 'online') {
        dot.className = 'status-dot online';
        text.textContent = 'Online';
        $('btnAppBotDisconnect').disabled = false;
        $('appbotCommandsGrid').style.opacity = '1';
        $('appbotCommandsGrid').style.pointerEvents = 'auto';
      } else if (status === 'connecting') {
        dot.className = 'status-dot connecting';
        $('appbotStatusText').textContent = 'Connecting...';
        $('btnAppBotDisconnect').disabled = true;
        $('appbotCommandsGrid').style.opacity = '0.5';
        $('appbotCommandsGrid').style.pointerEvents = 'none';
      } else if (status === 'error') {
        dot.className = 'status-dot error';
        $('appbotStatusText').textContent = 'Error';
        $('btnAppBotDisconnect').disabled = true;
        $('appbotCommandsGrid').style.opacity = '0.5';
        $('appbotCommandsGrid').style.pointerEvents = 'none';
      } else {
        dot.className = 'status-dot';
        $('appbotStatusText').textContent = 'Disconnected';
        $('btnAppBotDisconnect').disabled = true;
        $('appbotCommandsGrid').style.opacity = '0.5';
        $('appbotCommandsGrid').style.pointerEvents = 'none';
      }
    }
    
    function setSelfBotStatus(status) {
      const dot = $('selfbotStatusDot');
      const text = $('selfbotStatusText');
      const btn = $('btnSelfbotDisconnect');
      const cmds = $('selfbotCommandsGrid');
      
      if (!dot || !text || !btn || !cmds) return;
      
      if (status === 'online') {
        dot.className = 'status-dot online';
        $('selfbotStatusText').textContent = 'Online';
        $('btnSelfbotDisconnect').disabled = false;
        $('selfbotCommandsGrid').style.opacity = '1';
        $('selfbotCommandsGrid').style.pointerEvents = 'auto';
      } else if (status === 'connecting') {
        dot.className = 'status-dot connecting';
        $('selfbotStatusText').textContent = 'Connecting...';
        $('btnSelfbotDisconnect').disabled = true;
        $('selfbotCommandsGrid').style.opacity = '0.5';
        $('selfbotCommandsGrid').style.pointerEvents = 'none';
      } else if (status === 'error') {
        dot.className = 'status-dot error';
        $('selfbotStatusText').textContent = 'Error';
        $('btnSelfbotDisconnect').disabled = true;
        $('selfbotCommandsGrid').style.opacity = '0.5';
        $('selfbotCommandsGrid').style.pointerEvents = 'none';
      } else {
        dot.className = 'status-dot';
        $('selfbotStatusText').textContent = 'Disconnected';
        $('btnSelfbotDisconnect').disabled = true;
        $('selfbotCommandsGrid').style.opacity = '0.5';
        $('selfbotCommandsGrid').style.pointerEvents = 'none';
      }
    }
    
    function showMainTab(tab) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const page = document.getElementById('page-' + tab);
      const tabBtn = document.getElementById('tab-' + tab);
      if (page) page.classList.add('active');
      if (tabBtn) tabBtn.classList.add('active');
    }
    
    function clearLog() {
      const container = $('logContainer');
      if (container) container.innerHTML = '';
    }
    
    function saveLog() {
      const container = $('logContainer');
      if (!container) return;
      const content = container.innerText;
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nuke-bot-log-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.txt';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    // ==================== APP BOT (Direct WebSocket to Discord) ====================
    
    function setAppBotStatus(status) {
      const dot = $('appbotStatusDot');
      const text = $('appbotStatusText');
      const btn = $('btnAppBotDisconnect');
      const cmds = $('appbotCommandsGrid');
      
      if (!dot || !text || !btn || !cmds) return;
      
      if (status === 'online') {
        dot.className = 'status-dot online';
        text.textContent = 'Online';
        $('btnAppBotDisconnect').disabled = false;
        $('appbotCommandsGrid').style.opacity = '1';
        $('appbotCommandsGrid').style.pointerEvents = 'auto';
      } else if (status === 'connecting') {
        dot.className = 'status-dot connecting';
        $('appbotStatusText').textContent = 'Connecting...';
        $('btnAppBotDisconnect').disabled = true;
        $('appbotCommandsGrid').style.opacity = '0.5';
        $('appbotCommandsGrid').style.pointerEvents = 'none';
      } else if (status === 'error') {
        dot.className = 'status-dot error';
        $('appbotStatusText').textContent = 'Error';
        $('btnAppBotDisconnect').disabled = true;
        $('appbotCommandsGrid').style.opacity = '0.5';
        $('appbotCommandsGrid').style.pointerEvents = 'none';
      } else {
        dot.className = 'status-dot';
        $('appbotStatusText').textContent = 'Disconnected';
        $('btnAppBotDisconnect').disabled = true;
        $('appbotCommandsGrid').style.opacity = '0.5';
        $('appbotCommandsGrid').style.pointerEvents = 'none';
      }
    }
    
    function connectAppBot() {
      const token = $('appbotToken').value.trim();
      const serverId = $('appbotServerId').value.trim();
      const customName = $('appbotCustomName').value.trim();
      
      if (!token) {
        alert('Please enter bot token');
        return;
      }
      
      log('[APP BOT] Connecting to Discord gateway...', 'info');
      setAppBotStatus('connecting');
      appBotResolved = false;
      
      // Clear any existing connection
      if (appBotWs) {
        appBotWs.close();
        appBotWs = null;
      }
      if (appBotHeartbeat) clearInterval(appBotHeartbeat);
      if (appBotTimeout) clearTimeout(appBotTimeout);
      
      // Direct WebSocket to Discord (bypasses backend - works like selfbot!)
      appBotWs = new WebSocket('wss://gateway.discord.gg/?v=10&encoding=json');
      
      appBotWs.onopen = () => {
        log('[APP BOT] ✅ WebSocket connected, waiting for HELLO...', 'success');
      };
      
      appBotWs.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          
          if (msg.op === 10) {
            const heartbeat = msg.d.heartbeat_interval;
            log('[APP BOT] ✅ HELLO received, heartbeat: ' + heartbeat + 'ms', 'success');
            
            if (appBotHeartbeat) clearInterval(appBotHeartbeat);
            appBotHeartbeat = setInterval(() => {
              if (appBotWs && appBotWs.readyState === WebSocket.OPEN) {
                appBotWs.send(JSON.stringify({ op: 1, d: null }));
              }
            }, heartbeat);
            
            appBotWs.send(JSON.stringify({
              op: 2,
              d: {
                token: 'Bot ' + $('appbotToken').value.trim(),
                intents: 131071,
                properties: {
                  os: 'Windows',
                  browser: 'Discord',
                  device: 'Web',
                },
                compress: false,
                presence: { 
                  status: 'online', 
                  since: 0, 
                  activities: [{ name: $('appbotCustomName').value.trim() || 'KENZO x RYUGA', type: 0 }], 
                  afk: false 
                },
              },
            }));
            log('[APP BOT] 📤 IDENTIFY sent', 'info');
            
          } else if (msg.op === 0 && msg.t === 'READY') {
            if (!appBotResolved) {
              appBotResolved = true;
              log('[APP BOT] 🎉 App Bot READY on gateway!', 'success');
              appBotConnected = true;
              setAppBotStatus('online');
            }
            
          } else if (msg.op === 9) {
            log('[APP BOT] ❌ Invalid session (op 9) - token may be invalid or bot not in server', 'error');
            setAppBotStatus('error');
            
          } else if (msg.op === 11) {
            // Heartbeat ACK - silent
          }
        } catch (e) {
          console.error('Message error:', e);
        }
      };
      
      appBotWs.onerror = (err) => {
        log('[APP BOT] ❌ Gateway error: ' + err.message, 'error');
        setAppBotStatus('error');
      };
      
      appBotWs.onclose = (e) => {
        log('[APP BOT] Gateway closed: code=' + e.code + ', reason=' + (e.reason || 'none'), 'warning');
        if (appBotConnected) setAppBotStatus('offline');
      };
    }
    
    function disconnectAppBot() {
      if (appBotWs) {
        appBotWs.close();
        appBotWs = null;
      }
      if (appBotHeartbeat) clearInterval(appBotHeartbeat);
      appBotConnected = false;
      setAppBotStatus('offline');
      log('[APP BOT] Disconnected', 'warning');
    }
    
    function sendAppBotCommand(command) {
      const serverId = $('appbotServerId').value.trim();
      
      if (['BAN_ALL', 'KICK_ALL', 'DELETE_ALL', 'CREATE_CHANNELS'].includes(command)) {
        if (!$('appbotServerId').value.trim()) {
          log('[APP BOT] Please enter Server ID', 'error');
          return;
        }
      }
      
      if (command === 'BAN_ALL' || command === 'KICK_ALL' || command === 'DELETE_ALL' || command === 'CREATE_CHANNELS') {
        // These need REST API - send to backend
        const backendWs = new WebSocket('wss://nuke-bot-on85.onrender.com');
        backendWs.onopen = () => {
          backendWs.send(JSON.stringify({
            type: 'COMMAND',
            command,
            guildId: $('appbotServerId').value.trim(),
            ...(command === 'CREATE_CHANNELS' && { count: 50, name: 'nuked', type: 0 })
          }));
        };
        backendWs.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          if (msg.type === 'LOG') log('[BACKEND] ' + msg.message, msg.message.includes('✅') ? 'success' : 'info');
          else if (msg.type === 'ERROR') log('[BACKEND] ❌ ' + msg.message, 'error');
        };
      } else if (command === 'SPAM_ALL' || command === 'CLAIM_ROLES') {
        log('[APP BOT] ' + command + ' requires gateway - not implemented yet', 'warning');
      }
    }
    
    function disconnectAppBot() {
      if (appBotWs) {
        appBotWs.close();
        appBotWs = null;
      }
      if (appBotHeartbeat) clearInterval(appBotHeartbeat);
      appBotConnected = false;
      setAppBotStatus('offline');
      log('[APP BOT] Disconnected', 'warning');
    }
    
    // ==================== SELFBOT (Direct WebSocket) ====================
    
    function setSelfBotStatus(status) {
      const dot = $('selfbotStatusDot');
      const text = $('selfbotStatusText');
      const btn = $('btnSelfbotDisconnect');
      const cmds = $('selfbotCommandsGrid');
      
      if (!dot || !text || !btn || !cmds) return;
      
      if (status === 'online') {
        dot.className = 'status-dot online';
        $('selfbotStatusText').textContent = 'Online';
        $('btnSelfbotDisconnect').disabled = false;
        $('selfbotCommandsGrid').style.opacity = '1';
        $('selfbotCommandsGrid').style.pointerEvents = 'auto';
      } else if (status === 'connecting') {
        dot.className = 'status-dot connecting';
        $('selfbotStatusText').textContent = 'Connecting...';
        $('btnSelfbotDisconnect').disabled = true;
        $('selfbotCommandsGrid').style.opacity = '0.5';
        $('selfbotCommandsGrid').style.pointerEvents = 'none';
      } else if (status === 'error') {
        dot.className = 'status-dot error';
        $('selfbotStatusText').textContent = 'Error';
        $('btnSelfbotDisconnect').disabled = true;
        $('selfbotCommandsGrid').style.opacity = '0.5';
        $('selfbotCommandsGrid').style.pointerEvents = 'none';
      } else {
        dot.className = 'status-dot';
        $('selfbotStatusText').textContent = 'Disconnected';
        $('btnSelfbotDisconnect').disabled = true;
        $('selfbotCommandsGrid').style.opacity = '0.5';
        $('selfbotCommandsGrid').style.pointerEvents = 'none';
      }
    }
    
    function connectSelfbot() {
      const token = $('selfbotToken').value.trim();
      const serverId = $('selfbotServerId').value.trim();
      const customName = $('selfbotCustomName').value.trim();
      
      if (!token) {
        alert('Please enter user token');
        return;
      }
      
      log('[SELFBOT] Connecting to Discord gateway...', 'info');
      setSelfBotStatus('connecting');
      selfBotResolved = false;
      
      // Clear any existing connection
      if (selfBotWs) {
        selfBotWs.close();
        selfBotWs = null;
      }
      if (selfBotHeartbeat) clearInterval(selfBotHeartbeat);
      if (selfBotTimeout) clearTimeout(selfBotTimeout);
      
      // Direct WebSocket to Discord (bypasses backend)
      selfBotWs = new WebSocket('wss://gateway.discord.gg/?v=10&encoding=json');
      
      selfBotWs.onopen = () => {
        log('[SELFBOT] ✅ WebSocket connected, waiting for HELLO...', 'success');
      };
      
      selfBotWs.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          
          if (msg.op === 10) {
            const heartbeat = msg.d.heartbeat_interval;
            log('[SELFBOT] ✅ HELLO received, heartbeat: ' + heartbeat + 'ms', 'success');
            
            if (selfBotHeartbeat) clearInterval(selfBotHeartbeat);
            selfBotHeartbeat = setInterval(() => {
              if (selfBotWs && selfBotWs.readyState === WebSocket.OPEN) {
                selfBotWs.send(JSON.stringify({ op: 1, d: null }));
              }
            }, heartbeat);
            
            selfBotWs.send(JSON.stringify({
              op: 2,
              d: {
                token: $('selfbotToken').value.trim(),
                intents: 98351,
                properties: {
                  os: 'Windows',
                  browser: 'Chrome',
                  device: 'desktop',
                },
                compress: false,
                presence: { 
                  status: 'online', 
                  since: 0, 
                  activities: [{ name: $('selfbotCustomName').value.trim() || 'KENZO x RYUGA', type: 0 }], 
                  afk: false 
                },
              },
            }));
            log('[SELFBOT] 📤 IDENTIFY sent', 'info');
            
          } else if (msg.op === 0 && msg.t === 'READY') {
            if (!selfBotResolved) {
              log('[SELFBOT] 🎉 Selfbot READY on gateway!', 'success');
              selfBotConnected = true;
              setSelfBotStatus('online');
            }
            
          } else if (msg.op === 9) {
            log('[SELFBOT] ❌ Invalid session (op 9) - token may be invalid or account not in server', 'error');
            setSelfBotStatus('error');
            
          } else if (msg.op === 11) {
            // Heartbeat ACK - silent
          }
        } catch (e) {
          console.error('Message error:', e);
        }
      };
      
      selfBotWs.onerror = (err) => {
        log('[SELFBOT] ❌ Gateway error: ' + err.message, 'error');
        setSelfBotStatus('error');
      };
      
      selfBotWs.onclose = (e) => {
        log('[SELFBOT] Gateway closed: code=' + e.code + ', reason=' + (e.reason || 'none'), 'warning');
        if (selfBotConnected) setSelfBotStatus('offline');
      };
    }
    
    function disconnectSelfbot() {
      if (selfBotWs) {
        selfBotWs.close();
        selfBotWs = null;
      }
      if (selfBotHeartbeat) clearInterval(selfBotHeartbeat);
      selfBotConnected = false;
      setSelfBotStatus('offline');
      log('[SELFBOT] Disconnected', 'warning');
    }
    
    function sendSelfbotCommand(command) {
      log('[SELFBOT] ' + command + ' - not implemented for direct gateway', 'warning');
    }
    
    function clearLog() {
      $('logContainer').innerHTML = '';
    }
    
    function saveLog() {
      const container = $('logContainer');
      if (!container) return;
      const content = container.innerText;
      const blob = new Blob([content], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'nuke-bot-log-' + new Date().toISOString().slice(0,19).replace(/:/g,'-') + '.txt';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    // ==================== INITIALIZATION ====================
    function init() {
      $('tab-appbot').addEventListener('click', () => showMainTab('appbot'));
      $('tab-selfbot').addEventListener('click', () => showMainTab('selfbot'));
      $('btnClearLog').addEventListener('click', clearLog);
      $('btnSaveLog').addEventListener('click', saveLog);

      ['btnAppBotConnect', 'btnSelfbotConnect'].forEach(id => {
        $(id).addEventListener('click', () => log('Discord connections are unavailable in this panel.', 'warning'));
      });

      ['appbotCommandsGrid', 'selfbotCommandsGrid'].forEach(id => {
        $(id).addEventListener('click', event => {
          const button = event.target.closest('[data-cmd]');
          if (button) log('Discord commands are unavailable in this panel.', 'warning');
        });
      });

      log('Panel ready.', 'success');
    }

    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
    
    // Global error handler
    window.addEventListener('error', (e) => {
      log('❌ JavaScript Error: ' + e.message, 'error');
      console.error('Global error:', e);
    });
    
    window.addEventListener('unhandledrejection', (e) => {
      log('❌ Unhandled Promise Rejection: ' + e.reason, 'error');
      console.error('Unhandled rejection:', e);
    });
  </script>
</body>
